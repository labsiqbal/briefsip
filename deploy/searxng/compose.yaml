name: minarbot-searxng
services:
  searxng:
    image: searxng/searxng@sha256:6012a064924a032969a2e7989d66971803f126a237a2fb6c62f10ae3d82093e1
    container_name: minarbot-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8890:8080"
    env_file: env
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }
