[package]
name = "briefsip-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ammonia = "4"
regex = "1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
async-stream = "0.3"
base64 = "0.22"
jsonwebtoken = "9"
rusqlite = { version = "0.31", features = ["bundled", "functions", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
getrandom = "0.2"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
